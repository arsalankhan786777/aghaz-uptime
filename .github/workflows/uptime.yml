# ---------------------------------------------------------------------------
# Aghaz uptime watch — the 24/7 leg the PC watchdog cannot cover.
#
# WHY THIS REPO IS PUBLIC AND EMPTY OF EVERYTHING ELSE:
# GitHub gives a private repo 2,000 free Actions minutes a month. Every
# scheduled run bills a MINIMUM of one minute, so a 5-minute check costs
# 8,640 minutes — four times the free allowance. A PUBLIC repo has no minute
# limit at all, which is the only reason this lives apart from the codebase.
# So this repository holds exactly two public facts (two domain names that are
# already public) and nothing else. No source, no keys, no store data.
#
# WHAT IT WATCHES, AND WHY THE ASSERTION IS NOT JUST "200":
# A dead PHP process, an exhausted database pool or a half-deployed file can
# all answer 200 with a blank or truncated body. So a page is UP only when it
# answers 200 AND is a complete document (closes </html>) AND is big enough to
# be the real page. arsalanbrothers.com is ~265 KB and aghaz.pk ~181 KB today;
# the 20 KB floor is deliberately far below both so a normal content edit can
# never trip it, while a blank or error page sits far under it.
#
# WHY IT RETRIES:
# One failed request is not an outage — it is a dropped packet. A monitor that
# emails on the first blip gets muted by the human reading it, and a muted
# monitor is worse than none. Three tries, 20s apart, before it calls it down.
# ---------------------------------------------------------------------------
name: uptime

on:
  schedule:
    # Every 5 minutes. GitHub queues scheduled runs and can delay them under
    # load, so treat this as "about every 5 minutes", not a stopwatch.
    - cron: '*/5 * * * *'
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false      # one dead site must not hide the other's result
      matrix:
        site:
          - https://arsalanbrothers.com/
          - https://aghaz.pk/
          - https://admin.aghaz.pk/
    steps:
      - name: Check ${{ matrix.site }}
        run: |
          set -uo pipefail
          URL='${{ matrix.site }}'
          MIN_BYTES=20000
          for attempt in 1 2 3; do
            # -L follows redirects on purpose: a bare admin.aghaz.pk answers 302
            # to the central login by design, and that IS the healthy answer.
            body="$(mktemp)"
            code=$(curl -sL --max-time 30 \
                        -A 'AghazUptime/1.0 (+github actions)' \
                        -o "$body" -w '%{http_code}' "$URL" || echo 000)
            bytes=$(wc -c < "$body")
            closed=$(grep -c '</html>' "$body" || true)
            rm -f "$body"

            if [ "$code" = "200" ] && [ "$bytes" -ge "$MIN_BYTES" ] && [ "$closed" -ge 1 ]; then
              echo "UP   $URL  (http=$code bytes=$bytes, attempt $attempt)"
              exit 0
            fi

            echo "attempt $attempt failed: http=$code bytes=$bytes complete_document=$closed"
            [ "$attempt" -lt 3 ] && sleep 20
          done

          echo ""
          echo "::error title=Aghaz is DOWN::$URL failed 3 checks over ~40s (last: http=$code, ${bytes} bytes, complete_document=$closed)"
          exit 1
